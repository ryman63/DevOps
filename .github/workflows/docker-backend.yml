name: CI Build and Push Docker Image

on:
  push:
    branches:
      - main
      - lab3
  pull_request:

jobs:
  build-and-push:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Check Docker
        shell: powershell
        run: docker version

      - name: Install YC CLI (Windows)
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://storage.yandexcloud.net/yandexcloud-yc/install.ps1" -OutFile "install.ps1"
          .\install.ps1

      - name: YC auth
        shell: powershell
        env:
          YC_OAUTH_TOKEN: ${{ secrets.YC_OAUTH_TOKEN }}
        run: |
          yc config set token ${{ secrets.YC_OAUTH_TOKEN }} --profile sa-profile

      - name: Docker auth
        shell: powershell
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_OAUTH_TOKEN }}
        run: |
          docker login -u oauth -p ${{ secrets.YC_OAUTH_TOKEN }} cr.yandex

      - name: Verify JAR before build
        shell: powershell
        run: |
          cd devops-backend
          $jarFile = (Get-ChildItem "build/libs/*.jar" | Select-Object -First 1).Name
          Write-Host "Checking JAR: $jarFile"
          
          # Проверяем манифест
          jar xf "build/libs/$jarFile" META-INF/MANIFEST.MF
          cat META-INF/MANIFEST.MF
          rm META-INF/MANIFEST.MF

      - name: Build backend jar
        run: |
          cd devops-backend
          .\gradlew.bat clean bootJar

      - name: Build backend Docker image
        shell: powershell
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
        run: |
          cd devops-backend
          docker build --no-cache -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/backend:latest .
          docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/backend:latest


name: CI Build and Push Docker Image

on:
  push:
    branches:
      - main
      - lab3
  pull_request:

jobs:
  build-and-push:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install YC CLI (Windows)
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://storage.yandexcloud.net/yandexcloud-yc/install.ps1" -OutFile "install.ps1"
          .\install.ps1
          # Сохраняем ключ из секретов
          [System.IO.File]::WriteAllText("key.json", '${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}', [System.Text.Encoding]::UTF8)
          # Авторизация
          yc config profile create sa-profile
          yc config set service-account-key key.json

      - name: Build backend Docker image
        shell: powershell
        run: |
          cd devops-backend
          docker build -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/backend:1.0.0 .
          docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/backend:1.0.0


name: CI Build and Push Docker Image

on:
  push:
    branches:
      - main
      - lab3
  pull_request:

jobs:
  build-and-push:
    runs-on: self-hosted
    env:
      YC_OAUTH_TOKEN: ${{ secrets.YC_OAUTH_TOKEN }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Check Docker
        shell: powershell
        run: docker version

      - name: Install YC CLI (Windows)
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://storage.yandexcloud.net/yandexcloud-yc/install.ps1" -OutFile "install.ps1"
          .\install.ps1

      - name: Auth
        shell: cmd
        env:
          YC_OAUTH_TOKEN: ${{ secrets.YC_OAUTH_TOKEN }}
        run: |
          yc config set token "%YC_OAUTH_TOKEN%" --profile sa-profile

      - name: Build backend Docker image
        shell: cmd
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
        run: |
          cd devops-backend
          docker build -t cr.yandex/%YC_REGISTRY_ID%/backend:1.0.0 .
          docker push cr.yandex/%YC_REGISTRY_ID%/backend:1.0.0


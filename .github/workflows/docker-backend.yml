name: CI Build and Push Docker Image

on:
  push:
    branches:
      - main
      - lab3
  pull_request:

jobs:
  build-and-push:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Check Docker
        shell: powershell
        run: docker version



      - name: Docker auth
        shell: powershell
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_OAUTH_TOKEN }}
        run: |
          docker login -u oauth -p ${{ secrets.YC_OAUTH_TOKEN }} cr.yandex

      - name: Build backend jar with diagnostics
        shell: powershell
        run: |
          cd devops-backend
          
          # Удаляем старые JAR файлы
          Remove-Item build/libs/*.jar -Force -ErrorAction SilentlyContinue
          
          # Сборка с выводом информации
          ./gradlew clean bootJar
          
      - name: Build backend Docker image
        shell: powershell
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
        run: |
          cd devops-backend
          docker build --no-cache -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/backend:latest .
          docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/backend:latest


name: CI Build and Push Docker Image

on:
  push:
    branches:
      - main
      - lab3
  pull_request:

jobs:
  build-and-push:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Check Docker
        shell: powershell
        run: docker version

      - name: Install YC CLI (Windows)
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://storage.yandexcloud.net/yandexcloud-yc/install.ps1" -OutFile "install.ps1"
          .\install.ps1

      - name: YC auth
        shell: powershell
        env:
          YC_OAUTH_TOKEN: ${{ secrets.YC_OAUTH_TOKEN }}
        run: |
          yc config set token ${{ secrets.YC_OAUTH_TOKEN }} --profile sa-profile

      - name: Docker auth
        shell: powershell
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_OAUTH_TOKEN }}
        run: |
          docker login -u oauth -p ${{ secrets.YC_OAUTH_TOKEN }} cr.yandex

      - name: Build backend jar with diagnostics
        shell: powershell
        run: |
          cd devops-backend
          
          # Полная очистка
          .\gradlew.bat clean
          
          # Удаляем старые JAR файлы
          Remove-Item build/libs/*.jar -Force -ErrorAction SilentlyContinue
          
          # Сборка с выводом информации
          .\gradlew.bat bootJar --info
          
          # Детальная диагностика
          Write-Host "=== BUILD DIRECTORY CONTENTS ==="
          Get-ChildItem build -Recurse | Format-Table Name, Length
          
          Write-Host "=== JAR FILES ==="
          $jarFiles = Get-ChildItem "build/libs/*.jar"
          if ($jarFiles) {
              foreach ($jarFile in $jarFiles) {
                  Write-Host "JAR: $($jarFile.Name), Size: $($jarFile.Length) bytes"
                  
                  # Проверяем манифест
                  jar xf $jarFile.FullName META-INF/MANIFEST.MF
                  if (Test-Path "META-INF/MANIFEST.MF") {
                      Write-Host "=== MANIFEST for $($jarFile.Name) ==="
                      Get-Content META-INF/MANIFEST.MF
                      Remove-Item META-INF -Recurse -Force
                  } else {
                      Write-Host "ERROR: No manifest in $($jarFile.Name)"
                  }
              }
          } else {
              Write-Host "ERROR: No JAR files found!"
              exit 1
          }

      - name: Build backend Docker image
        shell: powershell
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
        run: |
          cd devops-backend
          docker build --no-cache -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/backend:latest .
          docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/backend:latest


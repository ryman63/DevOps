name: SonarQube Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Запуск каждый день в 2:00 UTC
    - cron: '0 2 * * *'

env:
  SONAR_PROJECT_KEY: devops-backend
  SONAR_ORGANIZATION: devops-org

jobs:
  sonarqube-analysis:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Полная история для анализа

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache SonarQube packages
      uses: actions/cache@v3
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar-${{ hashFiles('**/build.gradle') }}
        restore-keys: ${{ runner.os }}-sonar-

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Make gradlew executable
      run: chmod +x ./devops-backend/gradlew

    - name: Build and test
      run: |
        cd devops-backend
        ./gradlew clean build -x jacocoTestCoverageVerification

    - name: SonarQube Scan
      uses: sonarqube-quality-gate-action@v1.0.3
      timeout-minutes: 5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      with:
        scanMetadataReportFile: target/sonar/report-task.txt
        args: >
          -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          -Dsonar.projectName=DevOps Backend
          -Dsonar.projectVersion=1.0.0
          -Dsonar.sources=src/main/java
          -Dsonar.tests=src/test/java
          -Dsonar.java.binaries=build/classes
          -Dsonar.java.libraries=build/libs/*.jar
          -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
          -Dsonar.junit.reportPaths=build/test-results/test
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300
          -Dsonar.exclusions=**/generated/**,**/target/**,**/build/**
          -Dsonar.test.exclusions=**/test/**,**/tests/**
          -Dsonar.java.source=17
          -Dsonar.java.target=17
          -Dsonar.verbose=true

    - name: SonarQube Quality Gate Check
      id: sonarqube-quality-gate-check
      uses: sonarqube-quality-gate-action@v1.0.3
      timeout-minutes: 5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      continue-on-error: true

    - name: Comment PR with SonarQube results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && comment.body.includes('SonarQube')
          );
          
          const qualityGateStatus = '${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}';
          const qualityGateUrl = '${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-url }}';
          
          let commentBody = `## 🔍 SonarQube Analysis Results\n\n`;
          commentBody += `**Quality Gate Status:** ${qualityGateStatus}\n\n`;
          commentBody += `**Analysis URL:** ${qualityGateUrl}\n\n`;
          
          if (qualityGateStatus === 'PASSED') {
            commentBody += `✅ **Quality Gate PASSED** - Code quality meets the required standards.\n\n`;
          } else {
            commentBody += `❌ **Quality Gate FAILED** - Code quality issues need to be addressed.\n\n`;
            commentBody += `Please review the analysis results and fix the issues before merging.\n\n`;
          }
          
          commentBody += `---\n*This comment was automatically generated by SonarQube analysis.*`;
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: commentBody
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
          }

    - name: Send Telegram notification
      if: always()
      run: |
        if [ "${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}" = "PASSED" ]; then
          MESSAGE="✅ SonarQube Analysis: PASSED
        Project: DevOps Backend
        Quality Gate: PASSED
        Coverage: Available
        Time: $(date '+%Y-%m-%d %H:%M:%S')"
        else
          MESSAGE="❌ SonarQube Analysis: FAILED
        Project: DevOps Backend
        Quality Gate: FAILED
        Issues: Need to be fixed
        Time: $(date '+%Y-%m-%d %H:%M:%S')"
        fi
        
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=$MESSAGE" \
          -d "parse_mode=HTML"

    - name: Upload SonarQube reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sonarqube-reports
        path: |
          devops-backend/build/reports/jacoco/test/jacocoTestReport.xml
          devops-backend/build/test-results/test
        retention-days: 30

    - name: Notify on failure
      if: failure()
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=🚨 SonarQube Analysis Failed
        Project: DevOps Backend
        Error: Analysis could not be completed
        Time: $(date '+%Y-%m-%d %H:%M:%S')" \
          -d "parse_mode=HTML"

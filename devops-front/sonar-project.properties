# SonarQube Configuration for DevOps Frontend Project

# Project identification
sonar.projectKey=devops-frontend
sonar.projectName=DevOps Frontend
sonar.projectVersion=1.0.0
sonar.organization=devops-org

# Source code configuration
sonar.sources=src
sonar.tests=src
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.min.js,**/*.min.css
sonar.test.exclusions=**/test/**,**/tests/**,**/*.test.js,**/*.spec.js,**/__tests__/**

# Coverage exclusions
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.min.js,**/*.min.css

# Duplication exclusions
sonar.cpd.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.min.js,**/*.min.css

# Language specific settings
sonar.javascript.file.suffixes=.js,.jsx,.ts,.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Analysis parameters
sonar.verbose=true
sonar.log.level=INFO

# Branch analysis (for pull requests)
sonar.pullrequest.provider=GitHub
sonar.pullrequest.github.repository=Abuzer337/Devops4

# Additional exclusions for generated code
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.min.js,**/*.min.css,**/public/**,**/static/**

# Test exclusions
sonar.test.exclusions=**/test/**,**/tests/**,**/__tests__/**,**/*.test.js,**/*.spec.js,**/*.test.jsx,**/*.spec.jsx

# Coverage exclusions
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.min.js,**/*.min.css,**/public/**,**/static/**

# Duplication exclusions
sonar.cpd.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.min.js,**/*.min.css,**/public/**,**/static/**
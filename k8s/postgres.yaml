apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: app
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
          - name: POSTGRES_DB
            value: to_db
          - name: POSTGRES_USER
            value: root
          - name: POSTGRES_PASSWORD
            value: root
        ports:
          - containerPort: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: app
data:
  application.properties: |
    # Database configuration
    spring.datasource.url=jdbc:postgresql://postgres-service:5432/to_db
    spring.datasource.username=root
    spring.datasource.password=root
    spring.datasource.driver-class-name=org.postgresql.Driver
    
    # Hibernate configuration
    spring.jpa.database=postgresql
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.properties.hibernate.format_sql=true
    spring.jpa.properties.hibernate.show_sql=true
    
    # CORS configuration
    spring.mvc.cors.allowed-origins=*
    spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
    spring.mvc.cors.allowed-headers=*
    
    # Server port
    server.port=8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: cr.yandex/crpai9butnc0feto724c/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        command: ["java", "-jar", "/app.jar", "--spring.config.location=file:/app/config/application.properties"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        volumeMounts:
          - name: config-volume
            mountPath: /app/config
      volumes:
        - name: config-volume
          configMap:
            name: backend-config
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: app
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP